[project]
name = "abr-hls-packager"
version = "0.1.0"
description = "Adaptive-bitrate HLS packaging on top of FFmpeg: source-aware ladder, aligned GOPs, fMP4/CMAF or TS, loudness normalisation, thumbnail sprites and a validator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
abr-pack = "abr_pack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abr_pack"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: runs the real ffmpeg / ffprobe binaries (skipped when missing)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
