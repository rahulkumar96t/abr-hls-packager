name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test (unit + real-ffmpeg integration)
        run: uv run pytest -q -ra
